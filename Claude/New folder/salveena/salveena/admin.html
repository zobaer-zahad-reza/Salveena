<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salveena — Orders (Local Backup)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #e5e0d5; padding: 8px 10px; font-size: 13px; text-align: left; white-space: nowrap; }
  th { background: #14181c; color: #f4efe4; position: sticky; top: 0; }
  tr:nth-child(even) { background: #fbf9f3; }
</style>
</head>
<body class="bg-[#f4efe4] p-6">
  <div class="max-w-6xl mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div>
        <h1 class="text-xl font-semibold">Salveena Orders — Local Backup</h1>
        <p class="text-sm text-gray-600">এই লিস্টটা শুধু <b>এই ব্রাউজারে</b> সেভ হওয়া অর্ডার দেখায় (localStorage)। মূল ডেটাবেজ হলো
          আপনার connected Google Sheet — দেখুন <code>apps-script/SETUP.md</code>।</p>
      </div>
      <div class="flex gap-2">
        <button id="export-btn" class="bg-[#c9a227] text-[#14181c] font-semibold text-sm px-4 py-2 rounded-full">CSV ডাউনলোড করুন</button>
        <button id="clear-btn" class="bg-white border border-gray-300 text-sm px-4 py-2 rounded-full">লিস্ট ক্লিয়ার করুন</button>
      </div>
    </div>

    <div class="overflow-x-auto bg-white rounded-xl shadow-sm">
      <table id="orders-table">
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <p id="empty-msg" class="text-gray-500 text-sm mt-4 hidden">এখনো কোনো অর্ডার সেভ হয়নি।</p>
  </div>

<script>
  const COLS = ['orderId','date','time','name','phone','address','zone','items','itemCount','subtotal','discount','deliveryCharge','total','paymentMethod','trxId','note'];
  const LABELS = ['Order ID','Date','Time','Name','Phone','Address','Zone','Items','Qty','Subtotal','Discount','Delivery','Total','Payment','bKash TrxID','Note'];

  function getOrders() {
    try { return JSON.parse(localStorage.getItem('salveena_orders') || '[]'); }
    catch (e) { return []; }
  }

  function render() {
    const orders = getOrders();
    document.getElementById('table-head').innerHTML = LABELS.map(l => `<th>${l}</th>`).join('');
    document.getElementById('table-body').innerHTML = orders.map(o =>
      `<tr>${COLS.map(c => `<td>${(o[c] ?? '')}</td>`).join('')}</tr>`
    ).join('');
    document.getElementById('empty-msg').classList.toggle('hidden', orders.length > 0);
  }

  document.getElementById('export-btn').addEventListener('click', () => {
    const orders = getOrders();
    if (!orders.length) { alert('কোনো অর্ডার নেই।'); return; }
    const rows = [LABELS.join(',')].concat(
      orders.map(o => COLS.map(c => `"${String(o[c] ?? '').replace(/"/g, '""')}"`).join(','))
    );
    const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `salveena-orders-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    if (confirm('স্থানীয়ভাবে সেভ থাকা সব অর্ডার মুছে ফেলবেন? (Google Sheet-এ থাকা ডেটা এতে মুছবে না)')) {
      localStorage.removeItem('salveena_orders');
      render();
    }
  });

  render();
</script>
</body>
</html>
